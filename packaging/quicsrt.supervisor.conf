[program:quicsrt]
command=/usr/bin/quicsrt-gateway --no-gui --input srt --srt-mode listener --srt-port 9000 --bind 0.0.0.0 --latency 1000 --health-port 9090
directory=/var/lib/quicsrt
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/quicsrt/err.log
stdout_logfile=/var/log/quicsrt/out.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=3
environment=RUST_LOG="info"
