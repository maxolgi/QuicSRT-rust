; Example supervisord config for the quicsrt gateway.
; Deploy: copy to /etc/supervisor/conf.d/quicsrt.conf, then
;   supervisorctl reread && supervisorctl update && supervisorctl restart quicsrt
;
; Online deployment: PKI identity from Let's Encrypt (a real certificate for
; your domain, e.g. stream.example.com) so browsers trust udp :4433 directly
; and cert-hash.js advertises CERT_HASH = null (no self-signed pinning).
; The key must be readable by www-data: 0640 root:ssl-cert on
; /etc/letsencrypt/archive/stream.example.com/privkey*.pem — a certbot deploy
; hook should re-fix perms on renewal and restart the gateway.
[program:quicsrt]
; Replace CHANGE_ME_SRT_PASSPHRASE and CHANGE_ME_AUTH_TOKEN with real secrets before deploying.
command=/usr/local/bin/quicsrt-gateway --input srt --srt-mode listener --srt-port 9000 --srt-bind 0.0.0.0 --srt-passphrase CHANGE_ME_SRT_PASSPHRASE --bind 0.0.0.0 --wt-port 4433 --auth-token CHANGE_ME_AUTH_TOKEN --allowed-origins https://stream.example.com --health-port 9090 --latency 120 --cert-mode mkcert --cert-pem /etc/letsencrypt/live/stream.example.com/fullchain.pem --key-pem /etc/letsencrypt/live/stream.example.com/privkey.pem --web-bind 0.0.0.0 --web-port 8443
directory=/var/www/quicsrt
user=www-data
autostart=true
autorestart=true
startretries=3
stdout_logfile=/var/log/quicsrt/gateway.out.log
stderr_logfile=/var/log/quicsrt/gateway.err.log
environment=RUST_LOG="info"
