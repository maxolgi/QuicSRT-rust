name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Fast checks on every push / PR.
  #    No WASM, no web build — just workspace-wide cargo + tsc.
  # ---------------------------------------------------------------------------
  check:
    name: Lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build deps (eframe/egui needs X11/Wayland headers)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libxcb1-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxext-dev libxkbcommon-dev libwayland-dev

      # fmt is advisory (pre-existing diffs). clippy shows lints without
      # -D warnings so it doesn't error on intentional patterns like
      # wasm-bindgen camelCase getters.
      - name: cargo fmt --check
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace

      # Real WebTransport over loopback — the only test that exercises the full
      # handshake + data path (gated behind the `e2e` feature).
      - name: cargo test (e2e, real WebTransport loopback)
        run: cargo test -p quicsrt --features e2e --test e2e -- --test-threads=1

  # Note: tsc --noEmit is NOT in this job — the web TS imports WASM glue .js
  # files that are gitignored and only exist after ./build.sh wasm. Type-checking
  # happens in the build job (npm run build = tsc && vite build), which builds
  # WASM first.

  # ---------------------------------------------------------------------------
  # 2. Full build — Linux, Windows, macOS (ARM).
  #    Each matrix entry builds WASM → web/dist → gateway binary independently,
  #    because rust-embed embeds web/dist/ at compile time.
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            binary: quicsrt-gateway
            artifact: quicsrt-gateway-linux-x64
          - name: Windows x64
            os: windows-latest
            binary: quicsrt-gateway.exe
            artifact: quicsrt-gateway-windows-x64
          - name: macOS ARM
            os: macos-latest
            binary: quicsrt-gateway
            artifact: quicsrt-gateway-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack (Unix)
        if: runner.os != 'Windows'
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install wasm-pack (Windows)
        if: runner.os == 'Windows'
        run: cargo install wasm-pack --locked

      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Linux build deps (eframe/egui needs X11/Wayland headers)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libxcb1-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxext-dev libxkbcommon-dev libwayland-dev

      # Step 1: WASM crates → web/wasm/  (gitignored, must be built in CI)
      # Inlined (not build.sh) with shell: bash for Windows compatibility.
      - name: Build WASM crates
        shell: bash
        run: |
          for crate in srt-wasm mpeg2ts-wasm ts-muxer-wasm; do
            (cd "crates/$crate" && wasm-pack build --target web --release)
            mkdir -p "web/wasm/$crate"
            cp -f "crates/$crate/pkg/"* "web/wasm/$crate/"
          done

      # Step 2: web/dist/  (consumed by rust-embed at gateway compile time)
      - name: Build web UI (npm ci + vite build)
        shell: bash
        run: |
          cd web
          npm ci
          npm run build

      # Step 3: gateway binary — embeds web/dist/ via rust-embed
      - name: Build gateway binary
        run: cargo build --release -p quicsrt-gateway

      - name: Strip binary (Unix only)
        if: runner.os != 'Windows'
        run: strip target/release/${{ matrix.binary }}

      - name: Upload gateway binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error

      # web/dist is platform-agnostic — upload once from Linux only
      - name: Upload web/dist
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: quicsrt-web-dist
          path: web/dist/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. Debian package — built inside a debian:trixie (Debian 13) container.
  #    ubuntu-latest images carry a newer glibc (2.42), which would raise the
  #    deb's minimum requirement above Debian stable, and cargo-deb's $auto
  #    depends would resolve against Ubuntu's library versions. Building inside
  #    debian:trixie caps glibc at 2.41 and resolves deps against trixie.
  #    `container:` cannot be set conditionally from a matrix, hence a
  #    separate job from the ubuntu Linux build above.
  # ---------------------------------------------------------------------------
  build-deb:
    name: Build .deb (Debian trixie)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      # Must precede checkout: git is not in the base image.
      # eframe/egui needs the EGL/X11/Wayland headers.
      - name: Install build deps (Debian trixie)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git \
            build-essential cmake pkg-config \
            libegl-dev libgl1-mesa-dev \
            libxcb1-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxxf86vm-dev \
            libwayland-dev libxkbcommon-dev
          ldd --version | head -n 1

      - uses: actions/checkout@v5

      # dtolnay/rust-toolchain assumes rustup is preinstalled (true on GH
      # runners, not in the bare container), so install rustup directly.
      - name: Install Rust (stable + wasm32 target)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # Step 1: WASM crates → web/wasm/  (gitignored, must be built in CI)
      - name: Build WASM crates
        shell: bash
        run: |
          for crate in srt-wasm mpeg2ts-wasm ts-muxer-wasm; do
            (cd "crates/$crate" && wasm-pack build --target web --release)
            mkdir -p "web/wasm/$crate"
            cp -f "crates/$crate/pkg/"* "web/wasm/$crate/"
          done

      # Step 2: web/dist/  (consumed by rust-embed at gateway compile time)
      - name: Build web UI (npm ci + vite build)
        shell: bash
        run: |
          cd web
          npm ci
          npm run build

      # Step 3: gateway binary — embeds web/dist/ via rust-embed
      - name: Build gateway binary
        run: cargo build --release -p quicsrt-gateway

      # .deb package (binary already built, --no-build skips rebuild). $auto
      # depends resolve against trixie via dpkg-shlibdeps (from build-essential).
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build .deb package
        run: cargo deb -p quicsrt-gateway --no-build

      - name: Upload .deb
        uses: actions/upload-artifact@v7
        with:
          name: quicsrt-gateway-deb
          path: target/debian/*.deb
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 4. Publish a GitHub Release for every successful build.
  #    - Push to master  → regular release tagged dev-<short_sha>, marked
  #      "latest" (must NOT be a prerelease — GitHub ignores make_latest on
  #      pre-releases, losing the Latest badge and /releases/latest)
  #    - v* tag push      → stable release tagged <version>, marked "latest"
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    needs: [build, build-deb]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Stage release assets
        run: |
          mkdir -p release
          cp artifacts/quicsrt-gateway-linux-x64/quicsrt-gateway      release/quicsrt-gateway-linux
          cp artifacts/quicsrt-gateway-windows-x64/quicsrt-gateway.exe release/quicsrt-gateway-windows.exe
          cp artifacts/quicsrt-gateway-macos-arm64/quicsrt-gateway     release/quicsrt-gateway-macos
          cp artifacts/quicsrt-gateway-deb/*.deb release/
          (cd artifacts/quicsrt-web-dist && zip -r "$GITHUB_WORKSPACE/release/quicsrt-web-dist.zip" .)

      - name: Set release metadata
        id: meta
        env:
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          short="${SHA:0:7}"
          if [[ "$REF" == refs/tags/v* ]]; then
            echo "tag=${REF#refs/tags/}"    >> "$GITHUB_OUTPUT"
            echo "name=${REF#refs/tags/}"   >> "$GITHUB_OUTPUT"
            echo "prerelease=false"         >> "$GITHUB_OUTPUT"
            echo "make_latest=true"         >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-${short}"         >> "$GITHUB_OUTPUT"
            echo "name=Dev ${short}"        >> "$GITHUB_OUTPUT"
            echo "prerelease=false"          >> "$GITHUB_OUTPUT"
            echo "make_latest=true"         >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
