[package]
name = "quicsrt-gateway"
version.workspace = true
edition.workspace = true
default-run = "quicsrt-gateway"
license = "MPL-2.0"

[features]
sim-loss = ["quicsrt/sim-loss"]

[dependencies]
quicsrt = { path = "../quicsrt" }
clap.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
hex.workspace = true
bytes.workspace = true
srt-protocol.workspace = true
srt-tokio.workspace = true
wtransport.workspace = true
futures.workspace = true
eframe.workspace = true
axum.workspace = true
axum-server.workspace = true
rust-embed.workspace = true
mime_guess.workspace = true
rustls.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
local-ip-address = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[build-dependencies]
winresource = "0.1"

[[bin]]
name = "quicsrt-gateway"
path = "src/main.rs"

[[bin]]
name = "mock_obs"
path = "src/bin/mock_obs.rs"

[[bin]]
name = "wt_echo_client"
path = "src/bin/wt_echo_client.rs"

[dev-dependencies]
async-trait.workspace = true

[[bin]]
name = "wt_hs_probe"
path = "src/bin/wt_hs_probe.rs"

# cargo-deb metadata. Paths are relative to this manifest.
# `$auto` lets cargo-deb auto-detect shared-library deps via ldd;
# `supervisor` is added because we ship a supervisord config but the
# binary doesn't link against it (so $auto can't see it).
[package.metadata.deb]
maintainer = "QuicSRT maintainers <https://github.com/maxolgi/QuicSRT-rust>"
copyright = "2026"
license-file = ["../../LICENSE", "0"]
section = "net"
priority = "optional"
depends = "$auto, supervisor"
assets = [
    ["target/release/quicsrt-gateway", "usr/bin/", "755"],
    ["../../packaging/quicsrt.supervisor.conf", "etc/supervisor/conf.d/quicsrt.conf", "644"],
]
maintainer-scripts = "../../packaging/debian/"
